# Append the Host header so analytics can tell which hostname a request
# used (a specific .onion vs. clearnet onionpress.org). Appended rather
# than prepended to keep the standard "combined" field layout intact.
# Client IPs are pseudonymized at log-rotation time by onionpress.redact,
# so logging %h here is privacy-safe.
LogFormat "%h %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\" \"%{Host}i\"" combined
