; Allow large file uploads for My Creations
upload_max_filesize = 2G
post_max_size = 2G
max_execution_time = 300
max_input_time = 300

; The moss generation-upload endpoint (POST /wp-json/onionpress/v1/generation)
; reads the whole request body into a PHP string via $request->get_body() —
; WP's REST server buffers it before our route callback even runs, so this
; is unrelated to $_FILES-style multipart uploads (which stream to a temp
; file and don't need this). Default memory_limit is 128M; a ~65MB site
; generation blew through that with "Allowed memory size ... exhausted" in
; class-wp-rest-server.php, well before post_max_size/upload_max_filesize
; ever mattered. 512M covers today's sites with headroom for growth.
;
; receiver_version 1.2 switched the client to multipart, which does not
; need this -- but an old moss build still sends a raw body, and the OOM
; happens before our route callback can reject it cleanly. Keep this ini
; until the raw-body branch in onionpress_static_route_generation() is
; removed entirely (a later release); do not delete it just because the
; new client no longer exercises it.
memory_limit = 512M
