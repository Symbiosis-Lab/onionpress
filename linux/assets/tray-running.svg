<?xml version="1.0" encoding="UTF-8"?>
<!-- OnionPress tray icon — RUNNING state.
     Purple matches the Mac menubar's running color. Designed at 22x22
     (Ubuntu's standard tray size) but SVG scales for HiDPI. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22" width="22" height="22">
  <!-- Outer onion layer -->
  <circle cx="11" cy="11" r="9" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <!-- Middle ring -->
  <circle cx="11" cy="11" r="5.5" fill="none" stroke="#7c3aed" stroke-width="1.4"/>
  <!-- Centre dot -->
  <circle cx="11" cy="11" r="2" fill="#7c3aed"/>
</svg>
