<?xml version="1.0" encoding="UTF-8"?>
<!-- OnionPress tray icon — STOPPED state.
     Gray matches the Mac menubar's stopped color. Also used when
     serving from the Wayback fallback (the local site is effectively
     down; the tray's status-line text carries the distinction). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22" width="22" height="22">
  <circle cx="11" cy="11" r="9" fill="none" stroke="#6b7280" stroke-width="2"/>
  <circle cx="11" cy="11" r="5.5" fill="none" stroke="#6b7280" stroke-width="1.4"/>
  <circle cx="11" cy="11" r="2" fill="#6b7280"/>
</svg>
